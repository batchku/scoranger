[project]
name = "scoranger-engine"
version = "0.1.0"
description = "Deterministic score-manipulation engine for Scoranger (music21-based)"
requires-python = ">=3.10"
dependencies = ["music21>=9.1"]

[project.scripts]
scor = "scoranger_engine.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scoranger_engine"]
